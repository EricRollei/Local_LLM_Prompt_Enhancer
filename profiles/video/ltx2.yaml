id: ltx2
name: "LTX-2 / LTX-2.3 (video + audio)"
developer: "Lightricks"
summary: "Open-weights joint audio-video model read through Gemma 3 12B (1024 tokens). One flowing, chronological, literal paragraph with speech in quotes and sound woven through the action."
modality: video
tasks: [t2v, i2v]
encoder: "Gemma 3 12B (1024 tokens)"
encoder_family: llm
caption_style: prose
languages: [en]
target_words: [100, 200]
max_tokens: 1024
negative: "yes"
negative_default: "has_subtitles, has_blurbox, transition from black, transition to black, speech_ending_short, blurry, out of focus, overexposed, underexposed, low contrast, washed out colors, excessive noise, grainy texture, poor lighting, flickering, motion blur, distorted proportions, unnatural skin tones, deformed facial features, asymmetrical face, missing facial features, extra limbs, disfigured hands, wrong hand count, artifacts around text, inconsistent perspective, camera shake, incorrect depth of field, background too sharp, background clutter, distracting reflections, harsh shadows, inconsistent lighting direction, color banding, cartoonish rendering, 3D CGI look, unrealistic materials, uncanny valley effect, incorrect ethnicity, wrong gender, exaggerated expressions, wrong gaze direction, mismatched lip sync, silent or muted audio, distorted voice, robotic voice, echo, background noise, off-sync audio, incorrect dialogue, added dialogue, repetitive speech, jittery movement, awkward pauses, incorrect timing, unnatural transitions, inconsistent framing, tilted camera, flat lighting, inconsistent tone, cinematic oversaturation, stylized filters, or AI artifacts."
negative_note: "Used by the full (dev) model with CFG / STG. Distilled pipelines run without CFG and ignore it. Verbatim DEFAULT_NEGATIVE_PROMPT from ltx_pipelines/utils/constants.py."
quality_tokens: forbid
quoted_text: none
weights: false
audio: true
structure: "One paragraph, present tense, chronological: main action in a sentence -> movements and gestures -> appearances -> background -> camera angle and movement -> light and colour -> changes or sudden events. Optional lead: 'Style: <style>, ...'."
rules:
  - "Begin directly with the action or a visual detail. Never 'The scene opens with', 'We see', 'There is'."
  - "Literal and observable: emotion through physical cues ('his eyebrows angle downward'), not labels ('he looks sad')."
  - "Spoken words go in quotation marks, with the speaker identified by looks and the voice described: The man says in an excited voice: \"You won't believe what I just saw!\" State the language if it is not English and write it in its own script."
  - "Break dialogue into short quoted phrases with ONE acting direction between them (a glance, a pause, a change of voice). One unbroken block gets rushed."
  - "Never alter dialogue the user supplied, and invent none unless the idea involves someone speaking or singing."
  - "Weave the soundscape through the action in time order - 'soft footsteps on tile', 'the espresso machine hisses' - not dumped at the end, never just 'ambient sound'."
  - "Do not invent camera motion the user did not ask for (LTX-2 / 2.3 rule; LTX-2.5 is the opposite)."
  - "Fill the clip: enough events for its length, or the model rushes."
  - "Plain, restrained colour and light words."
avoid:
  - "Headings or labels such as 'Audio:' and 'Visual:', bullets, timestamps, scene cuts unless asked"
  - "Readable text and logos"
  - "Chaotic physics (juggling, jumping); dancing is fine"
  - "Many characters or layered simultaneous actions; conflicting light sources"
  - "Non-visual senses (smell, taste, touch)"
  - "Intensified colour words ('vibrant blue', 'blinding light')"
camera: [follows, tracks, pans across, circles around, tilts upward, pushes in, pulls back, overhead view, handheld movement, over-the-shoulder, wide establishing shot, static frame, slow dolly, crane, slow motion, time-lapse]
task_rules:
  i2v:
    target_words: [50, 140]
    rules:
      - "Describe only what CHANGES from the image; do not re-describe what it already shows - an inaccurate description can cause a scene cut."
      - "Concise and action-focused; no cuts."
official:
  - task: t2v
    url: "https://raw.githubusercontent.com/Lightricks/LTX-2/main/packages/ltx-core/src/ltx_core/text_encoders/gemma/encoders/prompts/gemma3_t2v_system_prompt.txt"
    format: text
  - task: i2v
    url: "https://raw.githubusercontent.com/Lightricks/LTX-2/main/packages/ltx-core/src/ltx_core/text_encoders/gemma/encoders/prompts/gemma3_i2v_system_prompt.txt"
    format: text
    note: "Lightricks' image-to-video enhancer was written for a vision model that sees the start image. Give this node a description of the image, or the rewriter works blind."
tailoring: |
  Keep within about 200 words.
sources:
  - {url: "https://github.com/Lightricks/LTX-2", supports: "versions, 200-word guidance, structure list, enhancer prompts, 1024-token limit, default negative prompt", confidence: high}
  - {url: "https://ltx.io/model/model-blog/prompting-guide-for-ltx-2", supports: "six elements, camera vocabulary, avoid list", confidence: medium}
  - {url: "https://ltx.io/blog/directing-dialogue-and-acting", supports: "dialogue segmentation and acting directions", confidence: medium}
checked: "2026-09-20"
confidence: high
