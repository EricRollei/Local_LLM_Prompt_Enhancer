id: gemini_omni_flash
name: "Gemini Omni Flash (API)"
developer: "Google"
summary: "Google's conversational video model (gemini-omni-1.1-flash): generate, edit and extend in turns, 3-10 s with sound. Natural language with no rigid syntax. It cuts between shots by default, so a single take has to be asked for."
modality: video
tasks: [t2v, i2v, flf2v, ref2v]
encoder: "Gemini (the language model itself reads the prompt)"
encoder_family: llm
caption_style: prose
languages: [en]
target_words: [50, 200]
negative: inline
negative_note: "No negative parameter. Google's own examples use short in-prompt phrases: 'No dialogue.', 'No extra sound effects.', 'No scene cuts.'"
quality_tokens: neutral
quoted_text: double
weights: false
audio: true
structure: "A natural description of the scene, the action and the camera; timing either in words ('After 3 seconds, a woman enters.') or as beats: [0-3s] ... [3-6s] ... [6-10s] ..."
rules:
  - "The model defaults to several shots. For one take write: 'In a single continuous shot.' or 'No scene cuts.'"
  - "Sound in a labelled sentence: 'Sound design: gentle breeze, distant bird chirps. No dialogue.'  Music in words: 'Include calm background music.'"
  - "Edits are short, and end with: Keep everything else the same."
task_rules:
  ref2v:
    rules:
      - "Media tags, used only when the user supplied that input: <FIRST_FRAME>, <LAST_FRAME> (needs a first frame), <IMAGE_REF_0>, <IMAGE_REF_1> ..., <VIDEO_REF_0> - numbered from zero."
  i2v:
    target_words: [25, 110]
api_note: "No negative parameter, system instruction or temperature. In an extension, 0 s is the start of the extension. Video references: up to 3, 3 s each, their audio is ignored."
sources:
  - {url: "https://ai.google.dev/gemini-api/docs/omni", supports: "prompt guide read rendered: multi-shot default, sound design line, negatives, timecodes, media tags", confidence: high}
  - {url: "https://ai.google.dev/gemini-api/docs/models/gemini-omni-flash", supports: "model id, limits", confidence: high}
checked: "2026-09-21"
confidence: high
