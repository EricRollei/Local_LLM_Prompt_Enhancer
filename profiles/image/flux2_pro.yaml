summary: "The hosted FLUX.2 models. Prompted exactly like FLUX.2 [dev] - prose, 30-80 words usually ideal, hex colours, quoted text, no negative prompt - with up to 8 reference images over the API. The difference that matters is in the API call: BFL's own prompt upsampling is ON by default."
