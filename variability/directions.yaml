# Direction axes for the Semantic Variation node.
#
# An axis is two small sets of example phrases. The direction is the vector from the centre of `from`
# to the centre of `to` in the embedder's space; with `direction_amount` above 0 every slot leans
# toward `to` when it moves, below 0 toward `from`. Six to ten concrete, visual phrases per side work
# best, and the two sides should differ in ONE quality only - otherwise the axis picks up whatever
# else differs (subject matter, length, style of wording).
#
# Add your own axes in variability/directions_user.yaml (same format; same name = yours replaces this one).

ordinary_to_uncanny:
  description: "everyday and unremarkable -> subtly wrong, out of place, quietly disturbing"
  from:
    - a plain kitchen chair
    - an ordinary office desk
    - a suburban front door
    - a cotton bedsheet on a washing line
    - a bowl of apples on a table
    - a man waiting at a bus stop
    - a tidy living room
    - a glass of water
  to:
    - a chair with one leg too many
    - a desk standing alone in a flooded field
    - a door set into a cliff face
    - a bedsheet hanging perfectly still in a gale
    - a bowl of apples that casts no shadow
    - a man whose shadow faces the wrong way
    - a living room with the furniture bolted to the ceiling
    - a glass of water with a staircase inside it

new_to_decayed:
  description: "pristine, freshly made -> weathered, corroded, overgrown, falling apart"
  from:
    - a freshly painted white wall
    - polished new brass
    - a brand new leather shoe
    - a crisp unread book
    - a newly built glass office block
    - fresh cut timber
    - a spotless enamel bathtub
    - a gleaming new car
  to:
    - a wall with paint peeling in long curls
    - brass gone green with verdigris
    - a cracked shoe with the sole hanging off
    - a water-swollen book furred with mould
    - an abandoned office block with broken windows and ivy
    - grey rotten timber crumbling at the ends
    - a rust-streaked bathtub in a derelict house
    - a burnt-out car sinking into brambles

