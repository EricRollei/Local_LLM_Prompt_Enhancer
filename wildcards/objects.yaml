# Tagged objects. Used by plain wildcards (__objects/kitchen__, __objects/**__) and by
# tag queries (__objects[metal AND handheld]__, __[hollow AND NOT modern]__).
#
# Tag vocabulary (keep it small and consistent - the surreal engine searches on it):
#   material  metal wood glass ceramic fabric paper stone plastic leather rubber wax organic bone
#   scale     tiny handheld tabletop furniture large
#   form      round long flat hollow container hinged wheeled sharp coiled paired soft rigid
#   domain    kitchen office medical nautical farm music lab toy ritual sport garden workshop
#             travel clothing optics timekeeping writing lighting
#   era       antique midcentury modern
#   quality   fragile heavy reflective transparent mechanical electrical worn
#
# Entries are mundane on purpose. Strangeness comes from what is done to an ordinary
# thing, never from the thing itself.

