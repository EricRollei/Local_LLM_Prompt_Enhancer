# Found strange (Atget, Crewdson): NOTHING impossible. The strangeness is hour, emptiness, stillness,
# a withheld story. Every entry is a CONDITION laid on the user's own scene, never a new scene.
# THE SUBJECT = the idea's main subject.
#
# The engine draws ONE hour and ONE condition, never more: a premise is a picture, not an inventory.
#
# Tags carry the one constraint that matters here, light:
#   hour:   dark = artificial light reads in this hour  |  bright = it does not
#   others: needs_dark = the condition is invisible in daylight, so it may only join a dark hour
# Without this, a third of the draws paired "noon with hardly a shadow" with "only one light is on",
# and the critic then invented a relation to join them.
#
# Every entry is a complete clause, so the engine can set it after the hour without patching grammar.
surreal:
  found_strange:
    hour:
      - {text: "the hour before dawn, artificial lights still on under a sky already pale", tags: [dark]}
      - {text: "noon with hardly a shadow, and nobody else about", tags: [bright]}
      - {text: "the last ten minutes of daylight, the sky still bright and the ground already dark", tags: [dark]}
      - {text: "three in the morning under sodium light", tags: [dark]}
      - {text: "a bright overcast Sunday, everything closed", tags: [bright]}
      - {text: "just after a storm, everything wet, the light suddenly clear", tags: [bright]}
    emptiness:
      - the place is built for many people and nobody else is in it
      - everything that can be opened in the scene stands open
      - {text: "only one light in the whole scene is on", tags: [needs_dark]}
      - something nearby has been set out for other people who have not arrived
      - {text: "a vehicle in the background has been left with its door open and its interior light on", tags: [needs_dark]}
      - everything in the scene is tidy except one thing knocked over and left
    stillness:
      - THE SUBJECT has stopped mid-gesture, listening for something
      - THE SUBJECT stands with arms at the sides, facing away from the obvious thing to look at
      - THE SUBJECT is fully dressed for going out and has not moved for some time
      - THE SUBJECT looks at something just outside the frame, and nothing in the picture says what
      - THE SUBJECT and everyone else present avoid looking at each other
      - THE SUBJECT holds an ordinary object a little too carefully
    light:
      - {text: "a pool of light lies on the ground with no visible source", tags: [needs_dark]}
      - {text: "light comes from under a closed door, and from behind a closed gate", tags: [needs_dark]}
      - a single beam falls through haze onto nothing in particular
      - {text: "the glow of a screen falls across a place where nobody is sitting", tags: [needs_dark]}
      - {text: "headlights rake the scene through a hedge", tags: [needs_dark]}
      - {text: "the only light in the scene spills from a fridge door, a drawer or a suitcase lid left slightly open", tags: [needs_dark]}
    trace:
      - a hose or a tap has been left running
      - a suitcase stands alone, packed and upright
      - a telephone receiver lies on the ground, off the hook
      - wet footprints cross the scene and stop at a wall
      - a neat mound of soil sits where no digging should happen
      - one shoe stands on the steps
