# Recurring motifs of the surrealists, from museum, foundation and scholarly sources (researched 2026-09-21).
#
# Every entry appears in at least TWO named works by that artist (listed under `works`), and is written as the
# concrete thing that is shown - never as what it "means". Provenance stays with each entry: `works`, `source`.
#
# Tags: the objects.yaml / spaces.yaml vocabulary (form, material, scale, domain, era, place kind), plus:
#   object | figure | place | device          what the entry is (device = a pictorial or process device)
#   high_confidence | medium_confidence | low_confidence
#       high = a museum/foundation/catalogue page was read and confirms it; medium = Wikipedia or scholarly text;
#       low = blog-level source, or one listed work is from general art-historical knowledge
#   overused    a motif that has become a cliche of imitation surrealism (melting watches, the apple over the face)
#   mature      nudity (Delvaux, Fini, some Magritte and Uelsmann) and all of Bellmer's dolls
#   <artist>    the artist's own name as a tag, e.g. magritte
#
# Usable as ordinary wildcards:  __surreal/motifs/magritte__   __surreal/motifs/**[object AND NOT overused]__
#                                __surreal/motifs/**[place AND NOT mature]__   __[de_chirico AND device]__
#
# These are the SURREALISTS' vocabularies. Your own recurring motifs go in iconography.yaml (copy it to
# ComfyUI/models/wildcards/), which the surreal engine draws from first. A private vocabulary is the point:
# lifting a famous motif as it is produces pastiche.
#
# Not covered yet, worth a second pass: Magritte's bilboquets (carved balusters) and Delvaux's gas lamps and
# candles (sources found but not tied to two works), Tanguy's scattered discs, Brauner's Conglomeros.

surreal:
  motifs:
